[project]
name = "aaf-io"
version = "0.1.0"
description = "Lenient PyAAF2 I/O, AAF SDK helpers, embedded essence extraction for Nuendo-like AAF."
requires-python = ">=3.10"
dependencies = ["PyAAF2>=1.7.1,<1.8"]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aaf_io"]
